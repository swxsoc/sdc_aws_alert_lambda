version: 0.2

env:
  shell: bash
  variables:
    ECR_REGION: us-east-1

phases:
  pre_build:
    commands:
      - |
        BANNER_SOURCE=${CODEBUILD_WEBHOOK_TRIGGER:-${CODEBUILD_SOURCE_VERSION:-manual}}
        BANNER_ENVIRONMENT=${CDK_ENVIRONMENT:-${ENVIRONMENT:-}}
        if [ -z "${BANNER_ENVIRONMENT}" ]; then
          case "${BANNER_SOURCE}" in
            branch/main|main|refs/heads/main) BANNER_ENVIRONMENT=PRODUCTION ;;
            pr/*|refs/pull/*|branch/*|refs/heads/*) BANNER_ENVIRONMENT=VALIDATION ;;
            *) BANNER_ENVIRONMENT=PRODUCTION ;;
          esac
        fi
        BANNER_ENVIRONMENT=$(printf '%s' "${BANNER_ENVIRONMENT}" | tr '[:lower:]' '[:upper:]')
        if [ "${BANNER_ENVIRONMENT}" = VALIDATION ]; then
          BANNER_ACTION='validate source and skip image publishing'
        else
          BANNER_ACTION='build and publish standalone image (guarded)'
        fi
        BANNER_PROJECT=${CODEBUILD_BUILD_ID%%:*}
        BANNER_COMMIT=${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}
        printf '\n%s\n' '================================================================================'
        printf '  SWxSOC BUILD: ALERT LAMBDA IMAGE\n'
        printf '%s\n' '================================================================================'
        printf '  Environment : %s\n' "${BANNER_ENVIRONMENT}"
        printf '  Mission     : swxsoc\n'
        printf '  Service     : alert\n'
        printf '  Action      : %s\n' "${BANNER_ACTION}"
        printf '  Project     : %s\n' "${BANNER_PROJECT:-local}"
        printf '  Build       : %s\n' "${CODEBUILD_BUILD_NUMBER:-local}"
        printf '  Trigger     : %s\n' "${BANNER_SOURCE}"
        printf '  Source ref  : %s\n' "${CODEBUILD_SOURCE_VERSION:-unknown}"
        printf '  Commit      : %.12s\n' "${BANNER_COMMIT}"
        printf '%s\n\n' '================================================================================'
      - set -euo pipefail
      - echo Installing CI/CD Dependencies...
      - python -m pip install --upgrade pip
      - pip3 install flake8 black pytest pytest-astropy pytest-cov
      - pip3 install -r requirements.txt
      - echo ________________________________

      # - echo Linting with Black...
      # - black --check --diff lambda_function
      # - echo ________________________________
      
      # - echo Linting with Flake...
      # - flake8 --count --max-line-length 88 lambda_function --exclude lambda_function_test_script.py
      # - echo ________________________________
    
  build:
    commands:
      - |
        case "${CODEBUILD_WEBHOOK_TRIGGER:-${CODEBUILD_SOURCE_VERSION:-manual}}" in
          branch/main|main|refs/heads/main|tag/*|refs/tags/*) ;;
          pr/*|refs/pull/*|branch/*|refs/heads/*)
            echo "Non-main build: dependency validation complete; skipping image publishing"
            exit 0
            ;;
        esac
      - set -euo pipefail
      - REGION=$ECR_REGION
      - ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
      - |
        echo Login to Private ECR $REGION
        ECR_PASSWORD=$(aws ecr get-login-password --region "$REGION")
        printf '%s\n' "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
      - echo ________________________________

      - echo Resolve target image and base image
      - |
        BASE_IMAGE="public.ecr.aws/w5r9l1c8/swsoc-docker-lambda-base:latest"
        ECR_REPO_NAME="swxsoc_sdc_aws_alert_lambda"
        ENVIRONMENT="${CDK_ENVIRONMENT:-PRODUCTION}"
        if git describe --tags --exact-match > /dev/null 2>&1; then
          echo "This is a tag push event"
          VERSION=$(git describe --tags --exact-match)
        elif [ "$ENVIRONMENT" = "DEVELOPMENT" ] || [ "$ENVIRONMENT" = "DEV" ]; then
          echo "This is a development environment"
          BASE_IMAGE="public.ecr.aws/w5r9l1c8/dev-swsoc-docker-lambda-base:latest"
          VERSION=$(date -u +"%Y%m%d%H%M%S")
        else
          echo "This is a production environment"
          VERSION=$(date -u +"%Y%m%d%H%M%S")
        fi
        ECR_REPO="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO_NAME"
        echo "Publishing image to $ECR_REPO with tag $VERSION"
      - echo ________________________________

      - echo Build Docker Image
      - docker build --build-arg BASE_IMAGE=$BASE_IMAGE -t $ECR_REPO:latest lambda_function/.

      - echo Tagging Docker Image...
      - docker tag $ECR_REPO:latest $ECR_REPO:$VERSION

      - echo Pushing the Docker image with Tags...
      - docker push $ECR_REPO:latest
      - docker push $ECR_REPO:$VERSION
      - echo ________________________________

      - echo Alert Lambda image published as a standalone ancillary asset with tag $VERSION.
      - echo ________________________________

  post_build:
    commands:
      - echo "Build phase finished on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
